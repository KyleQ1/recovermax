[package]
name = "recovermax-core"
description = "Core data recovery engine — filesystem parsing, carving, and recovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.9"
nom = "7"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytesize = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
