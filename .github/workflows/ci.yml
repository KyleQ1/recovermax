name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # Style lints run but are not gated; pre-existing clippy suggestions
      # (is_multiple_of, div_ceil, Default impls, etc.) are tracked separately.
      - name: Clippy
        run: cargo clippy --workspace
