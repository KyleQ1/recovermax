name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Only one concurrent run per PR so rapid comment/push sequences don't
# stomp each other's signature state.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    # Skip when the PR is from the maintainer account — no self-signing needed.
    if: (github.actor != 'KyleQ1')
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SETUP REQUIRED: create a fine-grained PAT with `contents: write`
          # on the signatures repo below, then add it as a repo secret named
          # `CLA_SIGNATURES_TOKEN`.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          # SETUP REQUIRED: create an empty public repository
          # (e.g. KyleQ1/recovermax-cla-signatures) and point this at it.
          remote-repository-name: 'recovermax-cla-signatures'
          remote-organization-name: 'KyleQ1'
          branch: 'main'
          path-to-document: 'https://github.com/KyleQ1/recovermax/blob/main/CLA.md'
          allowlist: KyleQ1,dependabot[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
          lock-pullrequest-aftermerge: false
